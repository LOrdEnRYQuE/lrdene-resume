api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "LOrdEnRYQuE Smart Business"
handle = "lordenryque-smart-business"

[[extensions.targeting]]
target = "customer-account.page.render"
module = "./src/SmartBusinessPage.jsx"

[extensions.capabilities]
